name: Update data

on:
  schedule:
    # 美股交易日（周一至周五）盘中每小时 + 收盘后一次，时间为 UTC
    # 冬令时(EST)常规交易 14:30–21:00 UTC；夏令时(EDT) 13:30–20:00 UTC
    - cron: "40 14-20 * * 1-5"   # 盘中每小时（开盘后，避开盘前无效报价）
    - cron: "30 21 * * 1-5"      # 收盘后
  workflow_dispatch:
    inputs:
      refresh_fund:
        description: "强制刷新基本面缓存"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate data.json
        id: gen
        run: |
          ARGS=""
          if [ "${{ inputs.refresh_fund }}" = "true" ]; then ARGS="--refresh-fund"; fi
          if python scripts/update.py $ARGS; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::数据更新失败（可能被 Yahoo 限流），保留旧的 data.json"
            git checkout -- data.json 2>/dev/null || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json fundamentals.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
      - name: Flag failed refresh
        if: steps.gen.outputs.ok != 'true'
        run: |
          echo "::error::数据更新失败，网站仍显示上一次的数据"
          exit 1
