name: Update data

on:
  schedule:
    # GitHub 定时任务高峰期常被延迟/丢弃，所以每次运行会在盘中循环刷新（约每 30 分钟），
    # 收盘后再刷新一次再退出（见 scripts/session.py）。下面几个 cron 只负责“启动/接力”，时间为 UTC，
    # 同时覆盖冬令时（开盘 14:30 UTC）与夏令时（开盘 13:30 UTC）。
    - cron: "35 13 * * 1-5"
    - cron: "35 16 * * 1-5"
    - cron: "35 19 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_fund:
        description: "强制刷新基本面缓存"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh during the trading session
        env:
          REFRESH_FUND: ${{ inputs.refresh_fund }}
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=()
          if [ "$REFRESH_FUND" = "true" ]; then ARGS+=(--refresh-fund); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then ARGS+=(--force); fi
          python scripts/session.py "${ARGS[@]}"
