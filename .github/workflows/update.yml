name: Update data

# 每次运行只“判断 + 最多刷新一次”，约 1 分钟结束（逻辑见 scripts/session.py）。
# 触发来源（任何一个准时就够，同时来也只刷新一次）：
#   1) 外部定时器（cron-job.org）每 30 分钟调用 workflow_dispatch —— 主力，GitHub 自带定时任务在盘中经常被丢弃；
#   2) 接力：盘中每次跑完，用本次运行自带的 GITHUB_TOKEN 再派发一次（wait_min 分钟后刷新），仓库里不存任何 token；
#   3) 下面的 schedule —— 备份（UTC，覆盖冬令时 14:30–21:00 和夏令时 13:30–20:00 的交易时段）。
on:
  schedule:
    - cron: "5,35 13-21 * * 1-5"
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "强制刷新（不管是否休市/数据是否刚更新）"
        type: boolean
        default: false
      refresh_fund:
        description: "强制刷新基本面缓存"
        type: boolean
        default: false
      wait_min:
        description: "接力用：先等多少分钟再刷新（手动运行请保持 0）"
        type: string
        default: "0"

permissions: {}

jobs:
  wait:
    # 只有“接力”运行才会等待。同一时间只保留一个在等待的接力，新的会替换旧的
    if: github.event_name == 'workflow_dispatch' && inputs.wait_min != '' && inputs.wait_min != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: update-chain
      cancel-in-progress: true
    steps:
      - name: Wait
        env:
          WAIT_MIN: ${{ inputs.wait_min }}
        run: |
          case "$WAIT_MIN" in ''|*[!0-9]*) echo "bad wait_min"; exit 1;; esac
          if [ "$WAIT_MIN" -gt 90 ]; then WAIT_MIN=90; fi
          echo "等待 $WAIT_MIN 分钟"; sleep $(( WAIT_MIN * 60 ))

  update:
    needs: wait
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: update-data
      cancel-in-progress: false
    permissions:
      contents: write   # 提交 data.json
      actions: write    # 接力：派发下一次 workflow_dispatch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh (at most once)
        id: run
        env:
          FORCE: ${{ inputs.force }}
          REFRESH_FUND: ${{ inputs.refresh_fund }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARGS=()
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$REFRESH_FUND" = "true" ]; then ARGS+=(--refresh-fund); fi
          python scripts/session.py "${ARGS[@]}"
      - name: Chain next refresh
        if: ${{ !cancelled() && steps.run.outputs.next_wait != '' && steps.run.outputs.next_wait != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.run.outputs.next_wait }}
        run: |
          # 已经有别的运行在排队/等待（另一条接力或外部触发），就不再重复派发
          OTHERS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 20 \
            --json databaseId,status --jq "[.[] | select(.databaseId != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$OTHERS" != "0" ]; then echo "已有 $OTHERS 个运行在排队/进行中，不重复接力"; exit 0; fi
          # GitHub API 偶发 HTTP 500：重试 3 次；仍失败只记警告（数据已提交，外部定时器仍会触发），不把整次运行标成失败
          for i in 1 2 3; do
            if gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main -f wait_min="$NEXT"; then
              echo "已派发接力：$NEXT 分钟后再刷新"; exit 0
            fi
            sleep $(( i * 10 ))
          done
          echo "::warning::接力派发失败（GitHub API 错误），依赖外部定时器/schedule 继续刷新"
